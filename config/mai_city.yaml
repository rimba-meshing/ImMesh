feature_extract_enable : 0
point_filter_num : 1
max_iteration : 3
dense_map_enable : 0
filter_size_surf : 0.5
filter_size_map : 0.5
cube_side_length : 1000
debug : 0
min_img_count : 150000
grid_size : 40
patch_size : 8
img_enable : 0
lidar_enable : 1
outlier_threshold : 78
img_point_cov : 1000
laser_point_cov : 0.001

common:
    lid_topic:  "/velodyne_points"
    imu_topic:  ""

preprocess:
    lidar_type: 2               # Velodyne HDL-64 Lidar
    scan_line: 64
    blind: 0.5                  # blind 0.5m minimum distance
    calib_laser: true           # true for KITTI-like datasets

mapping:
    imu_en: false               # Mai City dataset has no IMU
    imu_int_frame: 30
    acc_cov: 1.0
    gyr_cov: 0.5
    fov_degree:    180
    extrinsic_T: [ 0.0, 0.0, 0.0]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

voxel:
    voxel_map_en: true
    pub_plane_en: false
    dept_err: 0.04
    beam_err: 0.1
    min_eigen_value: 0.01
    match_s: 0.9
    sigma_num: 3
    voxel_size: 3
    max_layer: 4
    max_points_size: 1000
    layer_init_size: [5,5,5,5,5]

camera:
    img_topic: /left_camera/image
    Rcl: [ 0.000910902,   -0.999994,  0.00343779,
          -0.0101394,     -0.00344672,   -0.999943,
           0.999948,       0.000875869,  -0.0101423]
    Pcl: [0.051708, -0.004601, -0.023075]
    
publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: false
    scan_bodyframe_pub_en: false
    effect_point_pub: false
    pub_point_skip: 5

pcd_save:
    pcd_save_en: false
    type: 0
    interval: -1

image_save:
    img_save_en: false
    rot_dist: 0.0
    pos_dist: 0.0
    interval: 1

meshing:
    points_minimum_scale: 0.1       # The minimum distance between any of two points
    voxel_resolution: 0.4           # The resolution of voxel
    region_size: 10.0               # Size of region
    number_of_pts_append_to_map: 10000  # Number of pts appending to map (per-frame)
    if_draw_mesh: 0                 # DISABLED - No visualization for background execution
